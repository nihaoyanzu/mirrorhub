name: docker

on:
  push:
    # 日常 main 推送仍构建 sha 标签；以 release: 开头的提交只走 tag 构建，避免与 v* 双跑
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# 同一仓库同时只跑一个 GHCR 构建，避免 latest / 版本号 / sha 落在不同 digest
concurrency:
  group: docker-ghcr
  cancel-in-progress: false

jobs:
  build:
    # release 提交：跳过 branch 推送，只等 tag 构建（否则会 main + vX.Y 各跑一遍）
    if: >
      github.event_name != 'push' ||
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      !(startsWith(github.event.head_commit.message || '', 'release:'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 若仍 write_package denied：仓库 Settings → Actions → Workflow permissions
      # 选 Read and write；或添加 Secret GHCR_TOKEN（classic PAT: write:packages）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest 只跟 release tag，避免与 main 并发推送后和版本号 digest 错位
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # v1.2 不是完整 SemVer（缺 patch），仍发布 1.2 风格短标签
            type=match,pattern=^v(\d+\.\d+(?:\.\d+)?)$,group=1
            type=sha,prefix=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
